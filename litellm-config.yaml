model_list:
  # The Judgment/Patient-Facing Layer (Claude 3.5 Sonnet)
  - model_name: patient-agent
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: "os.environ/ANTHROPIC_API_KEY"
      max_tokens: 4096
      temperature: 0.3

  # The High-Volume Backend Processing Layer (Gemini 1.5 Flash)
  - model_name: backend-agent
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: "os.environ/GEMINI_API_KEY"
      rpm: 2000 # High rate limits for heavy parsing crons

litellm_settings:
  drop_params: true # Drop non-compatible OpenAI parameters automatically
  set_verbose: false
